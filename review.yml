aid: prolific-research
name: Prolific
review:
  question: Does Prolific expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Prolific's public developer surface is a
    versioned request/response REST API (base https://api.prolific.com/api/v1)
    authenticated with an API token. Prolific delivers asynchronous, event-driven
    notifications to researchers through Hooks (webhooks): Prolific POSTs a signed
    HTTP payload to a researcher-configured target_url when subscribed events
    occur (e.g. submission status changes, study status changes). That is
    server-to-endpoint HTTP with HMAC-SHA256 signatures (X-Prolific-Request-Signature
    / X-Prolific-Request-Timestamp) and exponential-backoff retries - not a
    persistent WebSocket or SSE channel on Prolific's own API. There is no
    server-push streaming transport on Prolific's API to model with AsyncAPI.
findings:
  summary: |
    Prolific does not publish a documented public WebSocket API. Prolific is an
    online research participant recruitment platform. Its public API is a
    standard, versioned REST interface at https://api.prolific.com/api/v1,
    authenticated with an API token supplied in the Authorization header as
    "Token <your token>". Every documented resource - studies, submissions,
    participant groups, projects, workspaces, messages, hooks, filters, bonuses,
    users - is accessed over request/response HTTPS using a collection endpoint
    (GET list / POST create) and an element endpoint (GET / PATCH / DELETE).
    Asynchronous event notification is provided by Hooks (webhooks), where
    Prolific calls a researcher-supplied HTTPS endpoint on events; this is not a
    WebSocket. No ws:// or wss:// endpoint is documented anywhere in the Prolific
    API reference as of the review date.
  openSource: |
    Prolific's core platform and API are proprietary/closed source and run as a
    hosted SaaS. Prolific does maintain a public GitHub organization
    (github.com/prolific-oss) with open-source developer tooling and examples -
    notably an experimental CLI (prolific-oss/cli) and several getting-started
    examples (external study link, survey, AI Task Builder) that call the public
    REST API. These are client tools, not the platform itself.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.prolific.com/api/v1
      documented: true
      note: Versioned request/response REST for all resources. API token auth via Authorization Token header.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Hooks POST signed event payloads (HMAC-SHA256) to a researcher-configured target_url. Server-to-endpoint HTTP, retried with exponential backoff; not a WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Prolific API reference as of the review date.
