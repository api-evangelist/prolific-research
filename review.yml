sources:
  - url: https://docs.prolific.com/api-reference
    type: Documentation
    note: API reference home; resource groups Studies, Submissions, Bonuses, Messages, Workspaces, Participant Groups, Hooks, Filters, Projects, Users, Surveys, AI Task Builder.
  - url: https://docs.prolific.com/api-reference/introduction/basic
    type: Documentation
    note: Base URL https://api.prolific.com/api/v1, REST collection/element pattern, optional Referer header.
  - url: https://docs.prolific.com/api-reference/studies/get-studies
    type: APIReference
    note: Confirmed GET /api/v1/studies/ with Authorization Token auth.
  - url: https://docs.prolific.com/api-reference/submissions/get-submissions
    type: APIReference
    note: Confirmed GET /api/v1/submissions/ requiring a study query param.
  - url: https://docs.prolific.com/api-reference/participant-groups
    type: APIReference
    note: Confirmed GET /api/v1/participant-groups/ scoped to workspace_id/project_id.
  - url: https://docs.prolific.com/api-reference/filters/get-filters
    type: APIReference
    note: Confirmed GET /api/v1/filters/.
  - url: https://docs.prolific.com/api-reference/workspaces/get-workspace
    type: APIReference
    note: Confirmed GET /api/v1/workspaces/{workspace_id}/.
  - url: https://docs.prolific.com/api-reference/projects/get-projects
    type: APIReference
    note: Confirmed GET /api/v1/workspaces/{workspace_id}/projects/.
  - url: https://docs.prolific.com/api-reference/messages/get-messages
    type: APIReference
    note: Confirmed GET /api/v1/messages/.
  - url: https://docs.prolific.com/api-reference/users/get-user
    type: APIReference
    note: Confirmed GET /api/v1/users/me/ returning ID and email.
  - url: https://docs.prolific.com/api-reference/bonuses/pay-bonus-payments
    type: APIReference
    note: Confirmed POST /api/v1/submissions/bonus-payments/ then POST /api/v1/bulk-bonus-payments/{id}/pay/ (up to 200 participants).
  - url: https://docs.prolific.com/api-reference/webhooks/verifying
    type: Documentation
    note: Hooks are signed HTTP webhooks (X-Prolific-Request-Signature / X-Prolific-Request-Timestamp, HMAC-SHA256). Not a WebSocket.
  - url: https://docs.prolific.com/documentation/core-concepts/managing-high-loads
    type: Documentation
    note: No fixed rate limits; implicit contention on the workspace wallet; 429 with Retry-After / backoff guidance.
  - url: https://www.prolific.com/pricing
    type: Pricing
    note: Pay-as-you-go; platform fee 42.8% corporate / 33.3% academic on top of participant rewards.
  - url: https://github.com/prolific-oss
    type: SourceCode
    note: Public GitHub org with open-source CLI and getting-started examples that call the REST API.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Prolific's own API. The public API is
    request/response REST, and its only asynchronous transport is Hooks
    (server-to-endpoint HTTP webhooks with HMAC-SHA256 signatures), which is
    modeled as a REST/webhook resource rather than an AsyncAPI server-push
    document. No AsyncAPI file was created.
