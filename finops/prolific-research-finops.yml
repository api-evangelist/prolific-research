meters:
- name: participant_rewards
  description: Rewards paid to participants for completed submissions, set per study.
  unit: currency
  aggregation: sum
  dimensions:
  - workspace
  - project
  - study
- name: platform_fee
  description: Platform fee charged as a percentage of participant rewards (42.8% corporate / 33.3% academic).
  unit: currency
  aggregation: sum
  dimensions:
  - workspace
  - study
- name: bonus_payments
  description: Discretionary bonus payments to participants for exceptional or follow-up work.
  unit: currency
  aggregation: sum
  dimensions:
  - workspace
  - study
- name: eligible_participants
  description: Size of the eligible participant pool after applying screening filters (affects reach and cost).
  unit: participants
  aggregation: max
  dimensions:
  - study
principles:
- name: Visibility
  description: Track reward, platform fee, and bonus spend per study/project/workspace via the study cost and workspace balance/cost-breakdown endpoints.
- name: Allocation
  description: Use workspaces and projects to map research spend to teams, grants, or cost centers.
- name: Optimization
  description: Right-size reward for estimated completion time, tighten screening filters to avoid over-recruiting, and use participant groups to re-contact known participants efficiently.
- name: Accountability
  description: Prefund wallets per workspace, review study cost before publishing (funds are locked at publish), and reconcile approved vs returned/rejected submissions.
