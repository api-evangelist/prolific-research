description: >-
  FinOps view of Prolific spend. Prolific is pay-as-you-go with no subscription:
  you prefund a workspace wallet and each published study debits participant
  rewards plus a platform fee (a percentage of rewards - 42.8% corporate, 33.3%
  academic/non-profit as of the review date). Bonus payments and returned/rejected
  submission handling also draw on the wallet. The dominant, controllable cost
  drivers are reward per participant, estimated completion time, number of
  participant places, screening filters (which change eligible pool size and
  price), and bonuses. The API bills the same wallet as the web app.
notes: >-
  Platform-fee percentages, minimum rewards, and currency handling change over
  time and by customer type/region; verify on the pricing page and calculator.
  Costs are incurred at study publish (funds are locked) and settled as
  submissions are approved.
