aid: prolific-research
url: https://raw.githubusercontent.com/api-evangelist/prolific-research/refs/heads/main/apis.yml
name: Prolific
kind: company
description: Prolific is an online research participant recruitment platform that connects
  researchers and AI teams with a large, vetted pool of human participants for surveys,
  experiments, and data annotation. The Prolific API is a versioned REST interface
  (https://api.prolific.com/api/v1) authenticated with an API token that lets researchers
  programmatically create and publish studies, review and approve submissions, manage
  participant groups, projects and workspaces, apply demographic filters and requirements,
  pay bonuses, message participants, and subscribe to event webhooks (hooks).
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Research
- Participant Recruitment
- Surveys
- Human Data
- Crowdsourcing
- Data Annotation
- AI Training
created: '2026-07-04'
modified: '2026-07-04'
specificationVersion: '0.19'
